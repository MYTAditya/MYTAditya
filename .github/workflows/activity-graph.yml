name: Update Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=github-dark&area=true&color=000000&line=000000&point=000000&bg_color=a9e43a
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push activity graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update activity graph SVG"
          branch: master
          file_pattern: "profile/activity-graph.svg"
