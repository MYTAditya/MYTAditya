name: Update Contribution Card
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Contribution Card SVG
        uses: FrancoStino/github-contribution-card/action@main
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: MYTAditya
          output-file: profile/github-contribution-card.svg
          hide-contributor-rank: 'false'
          hide-title: 'false'
          hide-border: 'true'
          bg-color: 0,A9E43A,01C45B
          theme: graywhite
          limit: 12
          combine-all-yearly-contributions: 'true'


      - uses: actions4git/add-commit-push@v1
        continue-on-error: true
